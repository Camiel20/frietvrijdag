name: Menu ophalen

# Elke nacht (en op vrijdagochtend nog een keer) het menu van De Posthoorn ophalen.
# Alleen bij een wijziging komt er een commit; GitHub Pages zet die vanzelf live.
on:
  schedule:
    - cron: '17 3 * * *'     # dagelijks 03:17 UTC
    - cron: '7 8 * * 5'      # vrijdag 08:07 UTC (09:07/10:07 NL)
  workflow_dispatch: {}       # handmatig: Actions → Menu ophalen → Run workflow

permissions:
  contents: write

jobs:
  menu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Menu ophalen
        run: python tools/haal_menu.py
      - name: Vastleggen als er iets veranderd is
        run: |
          if git diff --quiet -- docs/menu.json; then
            echo "Menu ongewijzigd."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/menu.json
            git commit -m "menu: bijgewerkt van De Posthoorn"
            git push
          fi
