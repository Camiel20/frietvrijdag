name: Menu ophalen

# Elke nacht (en op vrijdagochtend elk uur) het menu van De Posthoorn ophalen.
# Alleen bij een wijziging komt er een commit; GitHub Pages zet die vanzelf live.
# GitHub vertraagt geplande runs soms uren (03:17 draaide in de praktijk rond 11:00) of slaat
# ze over; daarom op vrijdag meerdere kansen, zodat de week-actie er vóór de lunch staat.
on:
  schedule:
    - cron: '17 3 * * *'     # dagelijks 03:17 UTC
    - cron: '41 5-10 * * 5'  # vrijdag elk uur 05:41–10:41 UTC (06:41–11:41 NL in de winter)
  workflow_dispatch: {}       # handmatig: Actions → Menu ophalen → Run workflow

permissions:
  contents: write

jobs:
  menu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Menu ophalen
        run: python tools/haal_menu.py
      - name: Vastleggen als er iets veranderd is
        run: |
          if git diff --quiet -- docs/menu.json; then
            echo "Menu ongewijzigd."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/menu.json
            git commit -m "menu: bijgewerkt van De Posthoorn"
            git push
          fi
